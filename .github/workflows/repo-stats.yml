name: GitHub Repo Stats
on:
  schedule:
    # Runs daily at 23:00 UTC
    - cron: "0 23 * * *"
  workflow_dispatch:
jobs:
  run-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Run github-repo-stats
        uses: jgehrcke/github-repo-stats@v1
        with:
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
